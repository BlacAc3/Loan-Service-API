openapi: 3.0.0
info:
  title: Loan Management API
  version: 1.0.0
  description: API for managing loans, repayments, and user accounts.

servers:
  - url: https://loan-service-api.vercel.app
    description: Production server
  - url: http://localhost:8000
    description: Local development server

paths:
  /api/auth/register/:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Invalid request data

  /api/auth/login/:
    post:
      summary: User login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
                  access_token:
                    type: string
        "401":
          description: Invalid credentials

  /api/auth/logout/:
    post:
      summary: Logout and blacklist the token
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: Refresh token to blacklist
      responses:
        "205":
          description: Successfully logged out
        "400":
          description: Invalid token

  /api/token/refresh/:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: Refresh token
      responses:
        "200":
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    description: New access token
        "401":
          description: Invalid refresh token

  /api/auth/user/:
    get:
      summary: Get authenticated user profile
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  firstname:
                    type: string
                  lastname:
                    type: string
                  totalLoanAmount:
                    type: string
                  meanInterestRate:
                    type: string
                  totalAppliedLoans:
                    type: string
                  totalRemainingBalance:
                    type: string
                  nextPayment:
                    type: string
                    format: date-time
                    nullable: true
        "401":
          description: Unauthorized access

  /api/loans/:
    get:
      summary: Get all loans for the authenticated user
      tags:
        - Loans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
        "401":
          description: Unauthorized access

    post:
      summary: Apply for a new loan
      tags:
        - Loans
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loan_amount
                - total_interest
                - term_months
              properties:
                loan_amount:
                  type: number
                  format: decimal
                  description: Amount of the loan
                total_interest:
                  type: number
                  format: decimal
                  description: Interest rate percentage
                term_months:
                  type: integer
                  description: Duration of the loan in months
      responses:
        "201":
          description: Loan application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          description: Invalid loan data

  /api/loans/{loan_id}/:
    get:
      summary: Get details of a specific loan
      tags:
        - Loans
      security:
        - bearerAuth: []
      parameters:
        - name: loan_id
          in: path
          required: true
          description: Loan ID
          schema:
            type: integer
      responses:
        "200":
          description: Loan details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Loan not found

  /api/loans/{loan_id}/approve/:
    get:
      summary: Approve a loan
      tags:
        - Loans
      security:
        - bearerAuth: []
      parameters:
        - name: loan_id
          in: path
          required: true
          description: Loan ID
          schema:
            type: integer
      responses:
        "200":
          description: Loan approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  loan_id:
                    type: string
                  current_status:
                    type: string
        "404":
          description: Loan not found
        "409":
          description: Loan already processed

  /api/loans/{loan_id}/reject/:
    get:
      summary: Reject a loan
      tags:
        - Loans
      security:
        - bearerAuth: []
      parameters:
        - name: loan_id
          in: path
          required: true
          description: Loan ID
          schema:
            type: integer
      responses:
        "200":
          description: Loan rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  loan_id:
                    type: string
                  current_status:
                    type: string
        "404":
          description: Loan not found

  /api/repayments/{loan_id}/:
    post:
      summary: Make a loan repayment
      tags:
        - Repayments
      security:
        - bearerAuth: []
      parameters:
        - name: loan_id
          in: path
          required: true
          description: Loan ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: decimal
                  description: Amount to repay
      responses:
        "200":
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  loan_id:
                    type: string
                  amount_paid:
                    type: string
                  amount_outstanding:
                    type: string
                  final_repayment_date:
                    type: string
                    format: date-time
        "400":
          description: Invalid payment amount
        "404":
          description: Loan not found

  /api/loans/{loan_id}/schedule/:
    get:
      summary: Get repayment schedule for a loan
      tags:
        - Loans
      security:
        - bearerAuth: []
      parameters:
        - name: loan_id
          in: path
          required: true
          description: Loan ID
          schema:
            type: integer
      responses:
        "200":
          description: Repayment schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentSchedule"
        "404":
          description: Loan not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Loan:
      type: object
      properties:
        id:
          type: integer
        loan_amount:
          type: number
          format: decimal
        total_interest:
          type: number
          format: decimal
        term_months:
          type: integer
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - paid
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        repayments:
          type: array
          items:
            $ref: "#/components/schemas/RepaymentSchedule"

    RepaymentSchedule:
      type: object
      properties:
        id:
          type: integer
        repay_amount_with_interest:
          type: number
          format: decimal
        end_of_month_due_amount:
          type: number
          format: decimal
        total_due_amount:
          type: number
          format: decimal
        expected_monthly_payment:
          type: number
          format: decimal
        due_date:
          type: string
          format: date-time
        remaining_months:
          type: integer
        total_months_for_payment:
          type: integer
